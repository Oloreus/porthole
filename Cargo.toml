[package]
name = "porthole"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Fast region screenshots for GNOME/Wayland: capture, copy, save"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
# only for feature flags; the API comes via gtk::gio
gio = { version = "0.21", features = ["v2_80"] }
# No tokio: zbus runs on its own async-io thread, futures are polled
# via the GLib main loop.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot", "global_shortcuts"] }
futures-util = { version = "0.3", default-features = false }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[profile.dev]
# keeps target/ small (low disk space)
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true

[package.metadata.deb]
maintainer = "Porthole <porthole@localhost>"
section = "utils"
priority = "optional"
depends = "$auto"
# Porthole itself doesn't need them: terminal programs like Claude Code read
# images from the clipboard via wl-paste (Wayland) or xclip (X11).
# Recommends instead of Depends – apt installs them by default anyway.
recommends = "wl-clipboard, xclip"
extended-description = """\
Small, fully local screenshot tool for GNOME on Wayland: \
select a region, preview it, copy it to the clipboard or save it as PNG. \
Uses xdg-desktop-portal exclusively, no X11/XWayland."""
# dpkg updates the .desktop and icon caches via the triggers of
# desktop-file-utils and hicolor-icon-theme – no maintainer scripts needed.
assets = [
    ["target/release/porthole", "usr/bin/", "755"],
    ["data/app.porthole.Porthole.desktop", "usr/share/applications/", "644"],
    ["data/icons/hicolor/scalable/apps/app.porthole.Porthole.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/hicolor/symbolic/apps/app.porthole.Porthole-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
]
